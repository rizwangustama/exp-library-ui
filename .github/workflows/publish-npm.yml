name: Publish NPM

on:
  release:
    types: [published]
  # Atau bisa juga trigger otomatis saat push tag 'v*':
  # push:
  #   tags:
  #     - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npx ng build exp-shared-ui

      - name: Publish to NPM
        run: npm publish ./dist/exp-shared-ui --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
