<div class="flex items-center">
  <input
    [id]="id"
    type="checkbox"
    [checked]="checked"
    [disabled]="disabled"
    (change)="onChange($event)"
    class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 disabled:cursor-not-allowed disabled:opacity-50 transition-colors"
  />
  <label [for]="id" class="ml-2 block text-sm font-medium text-gray-900 select-none" [class.opacity-50]="disabled" [class.cursor-not-allowed]="disabled">
    <ng-content></ng-content>
  </label>
</div>
