<div class="relative w-full text-left">
  <!-- Trigger -->
  <div 
    (click)="toggleDropdown()"
    class="flex items-center justify-between w-full rounded-xl border border-gray-300 bg-white px-4 py-2.5 text-sm text-gray-900 transition-all focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 cursor-pointer"
    [class.opacity-50]="disabled"
    [class.cursor-not-allowed]="disabled"
    [class.ring-2]="isOpen"
    [class.ring-blue-500]="isOpen"
    [class.border-blue-500]="isOpen">
    <span class="truncate" [class.text-gray-400]="!selectedLabels">
      {{ selectedLabels || placeholder }}
    </span>
    <!-- Chevron Icon -->
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 transition-transform duration-200" [class.rotate-180]="isOpen" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
    </svg>
  </div>

  <!-- Dropdown -->
  @if (isOpen) {
    <div class="absolute z-10 mt-1 w-full rounded-xl bg-white shadow-lg border border-gray-100 py-1 max-h-60 overflow-auto focus:outline-none text-sm">
      
      <!-- Search Input -->
      @if (searchable) {
        <div class="px-2 pb-2 pt-1 sticky top-0 bg-white border-b border-gray-100 z-20">
          <input 
            type="text" 
            [(ngModel)]="searchText"
            (click)="$event.stopPropagation()"
            placeholder="Search..." 
            class="w-full rounded-md border border-gray-300 px-3 py-1.5 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
          />
        </div>
      }

      <!-- Options List -->
      @for (option of filteredOptions; track getValue(option)) {
        <div 
          (click)="selectOption(option, $event)"
          class="cursor-pointer select-none relative py-2 pl-3 pr-9 hover:bg-blue-50 transition-colors"
          [class.bg-blue-50]="isSelected(option)"
          [class.text-blue-700]="isSelected(option)">
          
          <span class="block truncate" [class.font-medium]="isSelected(option)" [class.font-normal]="!isSelected(option)">
            @if (customOptionTemplate) {
              <ng-container *ngTemplateOutlet="customOptionTemplate; context: { $implicit: option, selected: isSelected(option) }"></ng-container>
            } @else {
              {{ getLabel(option) }}
            }
          </span>

          <!-- Check Icon for selected -->
          @if (isSelected(option)) {
            <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-blue-600">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
              </svg>
            </span>
          }
        </div>
      }

      @if (filteredOptions.length === 0) {
        <div class="py-3 px-4 text-center text-gray-500">
          No results found
        </div>
      }
    </div>
  }
</div>
