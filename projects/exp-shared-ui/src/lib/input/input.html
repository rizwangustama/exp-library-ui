<div class="relative w-full">
  @if (iconPosition === 'left') {
    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
      <ng-content select="[icon]"></ng-content>
    </div>
  }
  
  <input 
    [id]="id"
    [type]="type"
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="disabled"
    (input)="onInput($event)"
    class="block w-full rounded-xl border border-gray-300 bg-white py-2.5 text-sm text-gray-900 transition-all focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 disabled:cursor-not-allowed disabled:bg-gray-50 disabled:opacity-50"
    [class.pl-10]="iconPosition === 'left'"
    [class.pl-4]="iconPosition !== 'left'"
    [class.pr-10]="iconPosition === 'right'"
    [class.pr-4]="iconPosition !== 'right'"
  />

  @if (iconPosition === 'right') {
    <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-gray-500">
      <ng-content select="[icon]"></ng-content>
    </div>
  }
</div>
